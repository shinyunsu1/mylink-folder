<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <style>
      :root {
        --bg-color: #0a0a0a;
        --accent-color: #ffffff;
        --muted-color: #888888;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-color);
        color: var(--accent-color);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }

      /* 상단 프로필/헤더 */
      header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 20px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
        mix-blend-mode: difference;
      }

      .title {
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.05em;
      }

      .page-indicator {
        font-size: 0.85rem;
        font-family: monospace;
        letter-spacing: 0.05em;
      }

      /* 스크롤 진행바 */
      .progress-bar {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        background-color: var(--accent-color);
        width: 0%;
        z-index: 101;
        transition: width 0.1s ease-out;
      }

      /* 포트폴리오 피드 컨테이너 */
      .portfolio-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      /* 개별 슬라이드 카드 */
      .portfolio-item {
        position: relative;
        width: 100%;
        margin: 0;
        padding: 0;
        line-height: 0;
        opacity: 0.3;
        transition: opacity 0.6s ease;
      }

      .portfolio-item.is-visible {
        opacity: 1;
      }

      .portfolio-item img {
        width: 100%;
        height: auto;
        display: block;
        margin: 0;
        padding: 0;
      }

      /* 4번째 페이지: 유튜브 링크 오버레이 버튼 */
      .youtube-link-overlay {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 28px;
        background: rgba(15, 15, 15, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 40px;
        color: #fff;
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        transition: all 0.3s ease;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        line-height: 1;
      }

      .youtube-link-overlay:hover {
        background: #ff0000;
        border-color: #ff0000;
        transform: translateX(-50%) translateY(-3px);
        box-shadow: 0 15px 35px rgba(255, 0, 0, 0.4);
      }

      .youtube-icon {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }

      /* 맨 마지막 Thank You 섹션 */
      .thank-you-item {
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        background-color: #0d0d0d;
        padding: 80px 20px;
        gap: 20px;
        line-height: 1.5;
      }

      .thank-you-item h1 {
        font-size: 3.5rem;
        font-weight: 300;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .thank-you-item p {
        font-size: 1rem;
        color: var(--muted-color);
        letter-spacing: 0.05em;
      }

      /* 오른쪽 사이드 내비게이션 닷 */
      .side-nav {
        position: fixed;
        right: 24px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 90;
      }

      .nav-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.2);
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .nav-dot:hover {
        background-color: rgba(255, 255, 255, 0.6);
      }

      .nav-dot.active {
        background-color: var(--accent-color);
        transform: scale(1.6);
      }

      @media (max-width: 768px) {
        header {
          padding: 16px 20px;
        }

        .thank-you-item h1 {
          font-size: 2.2rem;
        }

        .youtube-link-overlay {
          bottom: 24px;
          padding: 10px 20px;
          font-size: 0.85rem;
        }

        .side-nav {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="progress-bar" id="progressBar"></div>

    <header>
      <div class="title">PORTFOLIO</div>
      <div class="page-indicator" id="pageIndicator">01 / 16</div>
    </header>

    <main class="portfolio-container" id="portfolioContainer"></main>

    <nav class="side-nav" id="sideNav"></nav>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const YOUTUBE_URL = "https://www.youtube.com/watch?v=KptUxlsqmDk";
        const TOTAL_IMAGES = 15;
        const TOTAL_SLIDES = TOTAL_IMAGES + 1; // 15장 이미지 + 1장 Thank You
        const container = document.getElementById("portfolioContainer");
        const sideNav = document.getElementById("sideNav");
        const progressBar = document.getElementById("progressBar");
        const pageIndicator = document.getElementById("pageIndicator");

        // 1~15번 이미지 생성
        for (let i = 1; i <= TOTAL_IMAGES; i++) {
          const item = document.createElement("article");
          item.classList.add("portfolio-item");

          const img = document.createElement("img");
          img.src = `${i}.png`; // mylink 루트 파일
          img.alt = `Portfolio Page ${i}`;
          img.loading = i <= 2 ? "eager" : "lazy";

          item.appendChild(img);

          // 4번째 이미지(4.png) 위에 유튜브 외부링크 버튼 추가
          if (i === 4) {
            const linkBtn = document.createElement("a");
            linkBtn.href = YOUTUBE_URL;
            linkBtn.target = "_blank";
            linkBtn.rel = "noopener noreferrer";
            linkBtn.classList.add("youtube-link-overlay");
            linkBtn.innerHTML = `
            <svg class="youtube-icon" viewBox="0 0 24 24">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            <span>Watch Video on YouTube</span>
          `;
            item.appendChild(linkBtn);
          }

          container.appendChild(item);
        }

        // 16번째 Thank You 엔딩 카드 생성
        const thankYouItem = document.createElement("article");
        thankYouItem.classList.add("portfolio-item", "thank-you-item");
        thankYouItem.innerHTML = `
        <h1>Thank You</h1>
        <p>Thank you for taking the time to view my portfolio.</p>
      `;
        container.appendChild(thankYouItem);

        // 사이드 닷 생성 및 클릭 스크롤 이벤트
        const items = document.querySelectorAll(".portfolio-item");

        items.forEach((item, index) => {
          const dot = document.createElement("div");
          dot.classList.add("nav-dot");
          if (index === 0) dot.classList.add("active");

          dot.addEventListener("click", () => {
            item.scrollIntoView({ behavior: "smooth", block: "start" });
          });

          sideNav.appendChild(dot);
        });

        const dots = document.querySelectorAll(".nav-dot");

        function updateProgressBar() {
          const scrollTop = window.scrollY;
          const docHeight =
            document.documentElement.scrollHeight - window.innerHeight;
          const scrollPercent = (scrollTop / docHeight) * 100;
          progressBar.style.width = `${Math.min(100, Math.max(0, scrollPercent))}%`;
        }

        const observerOptions = {
          root: null,
          rootMargin: "-40% 0px -40% 0px",
          threshold: 0,
        };

        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");

              const index = Array.from(items).indexOf(entry.target);
              const currentFormatted = String(index + 1).padStart(2, "0");
              const totalFormatted = String(TOTAL_SLIDES).padStart(2, "0");

              pageIndicator.textContent = `${currentFormatted} / ${totalFormatted}`;

              dots.forEach((dot, idx) => {
                dot.classList.toggle("active", idx === index);
              });
            }
          });
        }, observerOptions);

        items.forEach((item) => observer.observe(item));

        window.addEventListener("scroll", updateProgressBar);
        updateProgressBar();
      });
    </script>
  </body>
</html>
